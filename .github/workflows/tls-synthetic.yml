name: TLS synthetic harness
on:
  pull_request:
    paths:
      - 'windows-tls-relay/**'
      - 'admin_*.py'
      - 'callback_*.py'
      - requirements.txt
      - .github/workflows/tls-synthetic.yml
  push:
    branches: [main]
    paths:
      - 'windows-tls-relay/**'
      - 'admin_*.py'
      - 'callback_*.py'
      - requirements.txt
      - .github/workflows/tls-synthetic.yml
concurrency:
  group: tls-synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_NOLOGO: '1'
jobs:
  tls-synthetic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Synthetic Windows key A/B, Debug and Release
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            dotnet run --project windows-tls-relay/KeyProbe -c $configuration --disable-build-servers
            if ($LASTEXITCODE -ne 0) { throw "Synthetic key A/B failed" }
          }
      - name: Debug and Release synthetic TLS and Python join
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            $output = & dotnet run --project windows-tls-relay/SyntheticTests -c $configuration --disable-build-servers 2>&1
            $exit = $LASTEXITCODE
            $output | Write-Output
            if ($exit -ne 0) { throw "TLS harness failed in $configuration (exit $exit)" }
            $text = $output -join "`n"
            $matches = [regex]::Matches($text, '(?m)^PASS: (\d+) synthetic assertions\. No bank/provider/trust-store changes\.$')
            $cleanup = [regex]::Matches($text, '(?m)^TLS-CLEANUP: all named keys absent$')
            # Windows omits one Linux-only non-Windows-store rejection assertion.
            if ($matches.Count -ne 1 -or [int]$matches[0].Groups[1].Value -lt 75) {
              throw "Missing or incomplete synthetic assertion receipt in $configuration"
            }
            if ($cleanup.Count -ne 1 -or $cleanup[0].Index -ge $matches[0].Index) {
              throw "Missing or out-of-order named-key cleanup receipt in $configuration"
            }
          }
