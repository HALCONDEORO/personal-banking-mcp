name: Windows synthetic checks
on:
  pull_request:
    paths:
      - '**/*.py'
      - requirements.txt
      - .github/workflows/windows-synthetic.yml
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - requirements.txt
      - .github/workflows/windows-synthetic.yml
concurrency:
  group: windows-synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-synthetic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Explicit portable suite, no skips accepted
        run: python run_portable_tests.py
      - name: Optimized portable suite, no skips accepted
        run: python -O run_portable_tests.py
      - name: Synthetic MCP stdio demo
        run: python test_server.py --demo
