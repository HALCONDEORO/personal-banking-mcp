name: fixture checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest -v
      - run: python -O -m unittest -v
      - name: Explicit cooperative supervisor suite, no skips accepted
        run: python run_supervisor_tests.py
      - name: Optimized cooperative supervisor suite, no skips accepted
        run: python -O run_supervisor_tests.py
      - run: python test_server.py --demo
