name: windows store tests
on:
  pull_request:
    paths:
      - windows_private_store.py
      - test_windows_private_store.py
      - test_windows_native_store.py
      - .github/workflows/windows-store.yml
permissions:
  contents: read
concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native Windows store tests (synthetic bytes, zero skips, at least 16 tests)
        shell: python
        run: |
          import re, subprocess, sys
          p = subprocess.run([sys.executable, '-m', 'unittest', '-v', 'test_windows_private_store', 'test_windows_native_store'], capture_output=True, text=True)
          out = p.stdout + p.stderr
          print(out)
          m = re.search(r'Ran (\d+) tests', out)
          if p.returncode != 0 or not m or int(m.group(1)) < 16 or 'skipped' in out or 'RealDpapi' not in out:
              sys.exit('failed: nonzero exit, too few tests, skips, or native suite missing')
